<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <circle cx="45" cy="50" r="35" fill="#ffeb3b" stroke="#2d3436" stroke-width="3"/>
  <path d="M15 65 Q 45 90 75 65" fill="#ff9800" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="60" cy="40" r="15" fill="white" stroke="#2d3436" stroke-width="2.5"/>
  <circle cx="85" cy="40" r="12" fill="white" stroke="#2d3436" stroke-width="2.5"/>
  <!-- Pupils -->
  <circle cx="65" cy="40" r="5" fill="#2d3436"/>
  <circle cx="88" cy="40" r="4" fill="#2d3436"/>
  <!-- Highlights -->
  <circle cx="63" cy="37" r="2" fill="white"/>
  <circle cx="86" cy="37" r="1.5" fill="white"/>
  <!-- Beak -->
  <path d="M85 50 L 100 55 L 85 62 Z" fill="#ff9800" stroke="#2d3436" stroke-width="2"/>
  <line x1="85" y1="56" x2="95" y2="56" stroke="#2d3436" stroke-width="1.5"/>
  <!-- Crest -->
  <path d="M40 18 Q 45 5 55 15" fill="none" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 25 Q 35 12 45 22" fill="none" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M10 50 L 0 40 L 0 60 Z" fill="#2d3436"/>
  <!-- Wing -->
  <path d="M25 55 Q 10 75 35 70 Q 45 60 25 55" fill="white" stroke="#2d3436" stroke-width="2" opacity="0.8"/>
</svg>
