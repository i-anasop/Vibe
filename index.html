<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Glide | Official Web Game</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <!-- Canvas for rendering game world (bird, pipes, background scrolling) -->
        <canvas id="game-canvas"></canvas>
        
        <!-- UI Overlays -->
        <div id="ui-layer">
            <div id="score-display">0</div>
            
            <div id="auth-screen" class="screen active">
                <h1 class="title">WELCOME</h1>
                <p>Please enter your name</p>
                <input type="text" id="player-name-input" placeholder="ENTER NAME" maxlength="12" />
                <button id="save-name-btn" class="flappy-button">CONTINUE</button>
            </div>

            <div id="home-screen" class="screen">
                <div class="home-top-bar">
                    <div class="player-profile-card">
                        <div class="player-details">
                            <span class="player-name" id="profile-player-name">Player</span>
                            <span class="player-rank" id="profile-player-rank">Rank: #--</span>
                        </div>
                    </div>
                    <button id="open-settings-btn" class="settings-icon">⚙️</button>
                </div>
                
                <h1 class="title" style="margin-bottom: 20px;">FLAPPY GLIDE</h1>
                <button id="start-btn" class="flappy-button">PLAY GAME</button>
                <button id="show-leaderboard-start-btn" class="flappy-button">LEADERBOARD</button>
            </div>
            
            <div id="settings-screen" class="screen">
                <h1 class="title">SETTINGS</h1>
                <button id="open-skins-btn" class="flappy-button">SKINS</button>
                <button id="change-name-btn" class="flappy-button">CHANGE NAME</button>
                <button id="close-settings-btn" class="flappy-button" style="margin-top: 20px;">BACK TO HOME</button>
            </div>
            
            <div id="game-over-screen" class="screen">
                <h1 class="title">CRASHED</h1>
                <div class="score-board">
                    <p>SCORE: <span id="final-score">0</span></p>
                </div>
                <button id="restart-btn" class="flappy-button">PLAY AGAIN</button>
                <button id="show-leaderboard-btn" class="flappy-button">LEADERBOARD</button>
                <button id="game-over-home-btn" class="flappy-button">HOME MENU</button>
            </div>

            <div id="skins-screen" class="screen">
                <h1 class="title">SKINS</h1>
                <div class="skins-grid">
                    <div class="skin-card" data-skin="standard">
                        <div class="skin-preview" style="background: #f3c623;"></div>
                        <p>Standard</p>
                        <span>Unlocked</span>
                    </div>
                    <div class="skin-card locked" id="skin-gold" data-skin="golden">
                        <div class="skin-preview" style="background: #FFD700; box-shadow: 0 0 10px #FF8C00;"></div>
                        <p>Golden</p>
                        <span>🔒 Best: 20</span>
                    </div>
                    <div class="skin-card locked" id="skin-neon" data-skin="neon">
                        <div class="skin-preview" style="background: #00ffff; box-shadow: 0 0 15px #00ffff;"></div>
                        <p>Neon Blue</p>
                        <span>🔒 Best: 50</span>
                    </div>
                </div>
                <button id="close-skins-btn" class="flappy-button" style="margin-top: 20px;">BACK TO HOME</button>
            </div>

            <div id="leaderboard-screen" class="screen">
                <h1 class="title">LEADERBOARD</h1>
                <div class="score-board" style="margin-top: 10px; min-height: 250px; display: flex; flex-direction: column; justify-content: center;">
                    <ol id="leaderboard-list" style="margin: 0; padding: 0;"></ol>
                </div>
                <div style="display: flex; gap: 15px; margin-bottom: 15px;">
                    <button id="prev-page-btn" class="flappy-button" style="padding: 10px 20px; font-size: 1.2rem;">&laquo; PREV</button>
                    <button id="next-page-btn" class="flappy-button" style="padding: 10px 20px; font-size: 1.2rem;">NEXT &raquo;</button>
                </div>
                <button id="close-leaderboard-btn" class="flappy-button">BACK</button>
            </div>
        </div>
    </div>
    
    <script src="js/game.js"></script>
</body>
</html>
